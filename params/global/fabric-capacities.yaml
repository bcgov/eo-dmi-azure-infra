# Fabric capacity registry, consumed by stacks/shared (filters by home_env
# and scope != "dedicated"). "dedicated" entries are documentation only -
# those capacities are created directly by stacks/tenant via
# create_dedicated_capacity = true in the tenant's tenant.tfvars.
#
# Keys here are logical names, not Azure resource names - stacks/shared
# builds the actual Azure name as fc<ministry_code><program_code><key> with
# hyphens stripped (see docs/platform-guide.md "Naming conventions"). Reference
# a key by its logical name in a tenant's fabric_capacity_name (tenant.tfvars).
#
# name_override (optional):
#   Replaces the generated name outright. Use it when a capacity belongs to a
#   single tenant rather than the platform - the default name embeds
#   program_code, which misleadingly reads as platform-wide. Keep overrides in
#   the fc<ministry_code><tenant><qualifier> shape, all lowercase alphanumeric,
#   and check the name is not already taken by another entry.
#
#   WARNING: capacity "name" is ForceNew. Changing or removing an override on an
#   existing capacity destroys and recreates it. Set it once, at creation.
#
# scope:
#   shared-cross-env  - one capacity, usable by tenants in any environment.
#                        Typically homed in tools.
#   shared-env        - one capacity per environment, usable by all tenants
#                        in that environment (or) by specific tenants in that environment.
#   dedicated         - homed in the tenant's own platform RG, created by
#                        stacks/tenant, not listed here.
#
# tags (optional):
#   Merged over the platform-wide tags in params/<env>/shared.tfvars. Capacities
#   created by this stack get NO tenant tag automatically - unlike stacks/tenant
#   resources, where tenant and environment are derived - so set tags.tenant on
#   any capacity belonging to a single tenant. The capacity is the bulk of a
#   tenant's spend, so omitting it makes tenant-grouped cost reports misleading.
#
#   Azure tag values are opaque strings, max 256 chars. Cost Management groups on
#   the whole value and does not parse it, so a composite like
#   "bcts-dev,bcts-test" becomes one bucket you must split downstream - fine as
#   documentation, not usable as a grouping key. Keep tags.tenant a single
#   tenant name so it stays groupable.
#
#   A shared capacity is one billing line item regardless of tagging: Azure
#   cannot tell you how much of it each tenant or environment consumed. For that
#   use the Fabric Capacity Metrics app (CU per workspace). Tags say who to bill,
#   not how much each used.
#
# home_env: the environment whose stacks/shared instance creates the capacity,
# and whose remote state a referencing tenant must read. Prefer "tools" for any
# capacity spanning environments: every UAMI already has Storage Blob Data
# Reader on the tools state account, whereas homing in dev would require a new
# test -> dev grant in stacks/bootstrap/identity, a manual human-applied stack.


capacities:
  shared-cross-env:
    scope: shared-cross-env
    home_env: tools
    sku: F2
    administrator_members:
      - "Krishna.Rajendharan@gov.bc.ca" # TODO: replace with team Entra group object ID once group is set up


  bcts-nonprod:
    # Shared by the bcts dev and test tenants - one tenant across two
    # environments, NOT shared across tenants. Homed in tools rather than dev so
    # both environments' UAMIs can resolve its ID via remote state: every UAMI
    # already has Storage Blob Data Reader on the tools state account, whereas a
    # dev-homed capacity would need a new test -> dev grant in
    # stacks/bootstrap/identity, which is a manual human-applied stack.
    scope: shared-env
    home_env: tools
    sku: F4
    # Merged over the platform-wide tags from params/<env>/shared.tfvars.
    # Capacities created here get no tenant tag automatically (unlike
    # stacks/tenant resources), so set it explicitly or cost reports grouped by
    # tenant will miss this capacity - which is the bulk of a tenant's spend.
    # No environment tag: this one is homed in tools but serves dev and test, so
    # any single environment value would be wrong. See shared_scope below.
    tags:
      tenant: bcts
      shared_scope: "bcts-dev,bcts-test" # documentation only - see note in header
    # Without this the generated name would be fccitzdapbctsnonprod, which reads
    # as a platform-wide capacity. See name_override in the header.
    name_override: "fccitzbctsnonprod"
    administrator_members:
      # MUST be UPNs, not object IDs - unlike jumpbox_principal_ids and
      # kv_rbac_assignments elsewhere in this repo, which do take object IDs.
      # A raw user object ID here fails the create with:
      #   400 BadRequest: All provided principals must be existing, user or
      #   service principals
      # (confirmed against Microsoft.Fabric on 2026-08-12).
      - "Krishna.Rajendharan@gov.bc.ca" # krishna


  # Example additional environment-scoped shared capacity - add as needed:
  # shared-dev:
  #   scope: shared-env
  #   home_env: dev
  #   sku: F8
  #   administrator_members:
  #     - "<first.last@gov.bc.ca>" # UPN, not an object ID - see bcts-nonprod above
